name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build
# installers for Windows, macOS and Linux. electron-builder uploads them to a
# DRAFT GitHub Release; review it and click "Publish release" to make it public.
# The tag must match the "version" in apps/desktop/package.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm build:desktop
      - name: Package and upload to draft release
        run: pnpm --filter @elenchi/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificate yet: build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
